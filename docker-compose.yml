# Local development setup for Temporal + Talos
#
# Quick start:
#   docker compose up -d                # everything
#   docker compose up temporal -d       # just Temporal server
#   docker compose logs -f worker       # watch worker logs
#
# Temporal UI: http://localhost:8233
# API:         http://localhost:8000/docs
# Metrics:     http://localhost:8000/api/metrics

services:
  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"   # gRPC frontend
      - "8233:8233"   # Web UI
    environment:
      - DB=sqlite
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - temporal-data:/var/lib/temporal
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: ./python
      dockerfile: Dockerfile
    environment:
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_TASK_QUEUE=talos-procurement
      - TALOS_AUDIT_DB=/app/data/audit.db
      - TALOS_PROCUREMENT_DB=/app/data/procurement.db
    depends_on:
      temporal:
        condition: service_healthy
    volumes:
      - app-data:/app/data
    restart: on-failure

  api:
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "-m", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_TASK_QUEUE=talos-procurement
      - TALOS_AUDIT_DB=/app/data/audit.db
      - TALOS_PROCUREMENT_DB=/app/data/procurement.db
      # Uncomment to enable JWT auth:
      # - TALOS_JWT_SECRET=your-secret-here
    depends_on:
      temporal:
        condition: service_healthy
    volumes:
      - app-data:/app/data
    restart: on-failure

volumes:
  temporal-data:
  app-data:
